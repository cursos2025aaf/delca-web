<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Distribuidora DELCA | Materiales Eléctricos</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
  <header class="bg-blue-900 text-white p-4">
    <h1 class="text-2xl font-bold">DISTRIBUIDORA DELCA</h1>
    <p>Materiales Eléctricos por Mayor</p>
  </header>
  
  <main class="p-4">
    <div id="loading" class="text-center p-8">Cargando catálogo...</div>
    <div id="products" class="hidden grid grid-cols-1 md:grid-cols-3 gap-4"></div>
    <div id="error" class="hidden text-red-500 text-center p-8"></div>
  </main>

  <script>
    async function loadProducts() {
      try {
        const res = await fetch('/products.json');
        if (!res.ok) throw new Error('No se pudo cargar products.json');
        const products = await res.json();
        
        document.getElementById('loading').classList.add('hidden');
        const container = document.getElementById('products');
        container.classList.remove('hidden');
        
        container.innerHTML = products.slice(0, 10).map(p => `
          <div class="bg-white p-4 rounded shadow">
            <h3 class="font-bold">${p.codigo}</h3>
            <p class="text-sm">${p.descripcion}</p>
            <p class="text-blue-600 font-bold">$${p.precio.toLocaleString('es-AR')}</p>
          </div>
        `).join('');
      } catch (err) {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('error').classList.remove('hidden');
        document.getElementById('error').textContent = 'Error: ' + err.message;
      }
    }
    loadProducts();
  </script>
</body>
</html>
