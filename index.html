<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Distribuidora DELCA | Materiales Eléctricos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .cart-badge { position: absolute; top: -6px; right: -6px; background: #ef4444; color: white; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; display: flex; align-items: center; justify-content: center; font-weight: bold; }
    .fade-in { animation: fadeIn 0.3s ease-in; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-gray-50 text-gray-800">

  <!-- Header -->
  <header class="bg-blue-900 text-white sticky top-0 z-50 shadow-lg">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <!-- 🔌 LOGO: Reemplazá src con tu logo real cuando lo tengas -->
        <img src="https://via.placeholder.com/40x40/ffffff/1e3a8a?text=D" alt="DELCA Logo" class="w-10 h-10 rounded-lg bg-white p-1">
        <div>
          <h1 class="text-xl font-bold tracking-tight">DISTRIBUIDORA DELCA</h1>
          <p class="text-blue-200 text-xs">Materiales Eléctricos por Mayor</p>
        </div>
      </div>
      <button onclick="toggleCart()" class="relative p-2 hover:bg-blue-800 rounded-lg transition">
        🛒 <span id="cartCount" class="cart-badge hidden">0</span>
      </button>
    </div>
  </header>

  <!-- Buscador -->
  <div class="bg-white border-b sticky top-16 z-40 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 py-3">
      <input type="text" id="search" placeholder="🔍 Buscar por código (ej: 150P) o descripción..." 
             class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm" oninput="filterProducts()">
    </div>
  </div>

  <!-- Categorías -->
  <div class="px-4 py-2 max-w-7xl mx-auto flex gap-2 overflow-x-auto scrollbar-hide">
    <button onclick="filterByCategory('all')" class="cat-btn px-4 py-1.5 bg-blue-600 text-white rounded-full text-sm font-medium whitespace-nowrap transition">Todos</button>
    <button onclick="filterByCategory('Cables')" class="cat-btn px-4 py-1.5 bg-gray-200 hover:bg-gray-300 rounded-full text-sm whitespace-nowrap transition">Cables</button>
    <button onclick="filterByCategory('Protección')" class="cat-btn px-4 py-1.5 bg-gray-200 hover:bg-gray-300 rounded-full text-sm whitespace-nowrap transition">Protección</button>
    <button onclick="filterByCategory('Iluminación')" class="cat-btn px-4 py-1.5 bg-gray-200 hover:bg-gray-300 rounded-full text-sm whitespace-nowrap transition">Iluminación</button>
    <button onclick="filterByCategory('Interruptores')" class="cat-btn px-4 py-1.5 bg-gray-200 hover:bg-gray-300 rounded-full text-sm whitespace-nowrap transition">Interruptores</button>
    <button onclick="filterByCategory('Instalación')" class="cat-btn px-4 py-1.5 bg-gray-200 hover:bg-gray-300 rounded-full text-sm whitespace-nowrap transition">Instalación</button>
    <button onclick="filterByCategory('Zapatillas')" class="cat-btn px-4 py-1.5 bg-gray-200 hover:bg-gray-300 rounded-full text-sm whitespace-nowrap transition">Zapatillas</button>
    <button onclick="filterByCategory('Pilas')" class="cat-btn px-4 py-1.5 bg-gray-200 hover:bg-gray-300 rounded-full text-sm whitespace-nowrap transition">Pilas</button>
    <button onclick="filterByCategory('Herramientas')" class="cat-btn px-4 py-1.5 bg-gray-200 hover:bg-gray-300 rounded-full text-sm whitespace-nowrap transition">Herramientas</button>
  </div>

  <!-- Productos -->
  <main id="products" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 p-4 max-w-7xl mx-auto pb-20"></main>

  <!-- Carrito Modal -->
  <div id="cartModal" class="fixed inset-0 bg-black bg-opacity-60 hidden z-50 flex items-end md:items-center justify-center fade-in">
    <div class="bg-white w-full md:w-[500px] md:rounded-xl p-5 max-h-[85vh] overflow-y-auto shadow-2xl">
      <div class="flex justify-between items-center mb-4 border-b pb-3">
        <h2 class="text-xl font-bold text-gray-800">🛒 Tu Pedido</h2>
        <button onclick="toggleCart()" class="text-gray-500 hover:text-red-500 text-2xl font-bold">&times;</button>
      </div>
      <div id="cartItems" class="space-y-3 mb-4"></div>
      <div class="border-t pt-3 bg-gray-50 p-3 rounded-lg">
        <div class="flex justify-between items-center mb-3">
          <span class="font-medium text-gray-600">Total estimado:</span>
          <span id="cartTotal" class="text-2xl font-bold text-blue-800">$0</span>
        </div>
        <button onclick="sendToWhatsApp()" class="w-full bg-green-500 hover:bg-green-600 text-white py-3 rounded-lg font-bold text-lg transition flex items-center justify-center gap-2 shadow-md">
          📱 Enviar pedido por WhatsApp
        </button>
        <p class="text-xs text-gray-500 text-center mt-2">El mensaje se abrirá en WhatsApp listo para enviar.</p>
      </div>
    </div>
  </div>

  <footer class="bg-gray-900 text-gray-400 text-center py-6 text-sm">
    <p>© 2026 Distribuidora DELCA. Precios sujetos a modificación sin previo aviso.</p>
  </footer>

  <script>
    // ⚙️ CONFIGURACIÓN: Cambiá este número cuando quieras pasar al de tu amigo
    const WHATSAPP_NUMBER = '5491100000000'; // ← Formato: 549 + código área + número sin 15

    let products = [];
    let cart = [];
    let filteredProducts = [];

    async function loadProducts() {
      try {
        const res = await fetch('products.json');
        products = await res.json();
        filteredProducts = [...products];
        renderProducts();
      } catch (e) {
        document.getElementById('products').innerHTML = `<p class="text-red-500 col-span-full text-center">Error cargando catálogo. Verificá que products.json esté en la misma carpeta.</p>`;
      }
    }

    function formatPrice(price) {
      return '$ ' + price.toLocaleString('es-AR', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
    }

    function renderProducts() {
      const container = document.getElementById('products');
      if (filteredProducts.length === 0) {
        container.innerHTML = `<p class="col-span-full text-center text-gray-500 py-8">No se encontraron productos.</p>`;
        return;
      }
      container.innerHTML = filteredProducts.map(p => `
        <div class="bg-white border rounded-xl p-4 hover:shadow-lg transition flex flex-col justify-between fade-in">
          <div>
            <span class="text-xs font-semibold text-blue-600 bg-blue-50 px-2 py-0.5 rounded">${p.codigo}</span>
            <h3 class="font-medium text-sm mt-2 mb-3 line-clamp-2 h-10 text-gray-800">${p.descripcion}</h3>
            <div class="flex justify-between items-end">
              <span class="font-bold text-lg text-gray-900">${formatPrice(p.precio)}</span>
              <span class="text-xs text-gray-500 bg-gray-100 px-2 py-0.5 rounded">${p.categoria.split('/')[0]}</span>
            </div>
          </div>
          <button onclick="addToCart('${p.codigo}')" class="mt-4 w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition font-medium text-sm flex items-center justify-center gap-1">
            + Agregar
          </button>
        </div>
      `).join('');
    }

    function filterProducts() {
      const term = document.getElementById('search').value.toLowerCase().trim();
      filteredProducts = products.filter(p => 
        p.codigo.toLowerCase().includes(term) || 
        p.descripcion.toLowerCase().includes(term)
      );
      renderProducts();
    }

    function filterByCategory(cat) {
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.replace('bg-blue-600','bg-gray-200'));
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('text-white'));
      event.target.classList.replace('bg-gray-200','bg-blue-600');
      event.target.classList.add('text-white');

      if (cat === 'all') {
        filteredProducts = [...products];
      } else {
        filteredProducts = products.filter(p => p.categoria.startsWith(cat));
      }
      renderProducts();
    }

    function addToCart(code) {
      const product = products.find(p => p.codigo === code);
      const existing = cart.find(item => item.codigo === code);
      existing ? existing.cantidad++ : cart.push({...product, cantidad: 1});
      updateCartUI();
      
      const btn = event.target;
      const original = btn.innerHTML;
      btn.innerHTML = '✓ Agregado';
      btn.classList.replace('bg-blue-600','bg-green-600');
      setTimeout(() => {
        btn.innerHTML = original;
        btn.classList.replace('bg-green-600','bg-blue-600');
      }, 1000);
    }

    function updateCartUI() {
      const countBadge = document.getElementById('cartCount');
      const total = cart.reduce((sum, i) => sum + i.cantidad, 0);
      countBadge.textContent = total;
      countBadge.classList.toggle('hidden', total === 0);

      const container = document.getElementById('cartItems');
      if (cart.length === 0) {
        container.innerHTML = '<p class="text-gray-500 text-center py-6">El carrito está vacío</p>';
        document.getElementById('cartTotal').textContent = '$0';
        return;
      }
      container.innerHTML = cart.map(item => `
        <div class="flex justify-between items-center bg-gray-50 p-3 rounded-lg border">
          <div class="flex-1">
            <div class="font-bold text-sm">${item.codigo}</div>
            <div class="text-xs text-gray-500 line-clamp-1">${item.descripcion}</div>
            <div class="flex items-center gap-3 mt-2">
              <button onclick="updateQuantity('${item.codigo}', -1)" class="w-6 h-6 bg-gray-200 rounded flex items-center justify-center hover:bg-gray-300">−</button>
              <span class="font-medium text-sm w-4 text-center">${item.cantidad}</span>
              <button onclick="updateQuantity('${item.codigo}', 1)" class="w-6 h-6 bg-gray-200 rounded flex items-center justify-center hover:bg-gray-300">+</button>
            </div>
          </div>
          <div class="text-right ml-3">
            <div class="font-bold text-sm">${formatPrice(item.precio * item.cantidad)}</div>
            <button onclick="removeFromCart('${item.codigo}')" class="text-xs text-red-500 hover:underline mt-1">Quitar</button>
          </div>
        </div>
      `).join('');
      const cartTotal = cart.reduce((sum, i) => sum + (i.precio * i.cantidad), 0);
      document.getElementById('cartTotal').textContent = formatPrice(cartTotal);
    }

    function updateQuantity(code, delta) {
      const item = cart.find(i => i.codigo === code);
      if (item) {
        item.cantidad += delta;
        if (item.cantidad <= 0) removeFromCart(code);
        else updateCartUI();
      }
    }

    function removeFromCart(code) {
      cart = cart.filter(item => item.codigo !== code);
      updateCartUI();
    }

    function toggleCart() {
      const modal = document.getElementById('cartModal');
      modal.classList.toggle('hidden');
      if (!modal.classList.contains('hidden')) updateCartUI();
    }

    function sendToWhatsApp() {
      if (cart.length === 0) return alert('Agregá productos al carrito primero');
      
      const total = cart.reduce((sum, i) => sum + (i.precio * i.cantidad), 0);
      const lines = cart.map(item => 
        `▫️ ${item.codigo} | ${item.descripcion}\n   Cant: ${item.cantidad} | Subtotal: ${formatPrice(item.precio * item.cantidad)}`
      );
      
      const message = `🔌 *PEDIDO DELCA*\n\n${lines.join('\n')}\n\n💰 *TOTAL ESTIMADO: ${formatPrice(total)}*\n\n📍 *Cliente:* \n📞 *Teléfono:* \n🚚 *Dirección de entrega:* \n📝 *Comentarios:* \n\n*Solicito confirmación de stock y precio mayorista.*`;
      
      const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
      window.open(url, '_blank');
    }

    document.addEventListener('DOMContentLoaded', loadProducts);
  </script>
</body>
</html>
